    <path d="M100 400 L100 200" stroke="#8B4513" stroke-width="20" fill="none"/>
    
    <!-- Palm Leaves -->
    <g transform="translate(100,200)">
        <!-- Left Leaves -->
        <path d="M0 0 Q-50 -30 -80 -10 Q-100 10 -90 40" stroke="#228B22" stroke-width="8" fill="none"/>
        <path d="M0 0 Q-60 -20 -90 0 Q-120 20 -110 50" stroke="#228B22" stroke-width="8" fill="none"/>
        <path d="M0 0 Q-70 -10 -100 10 Q-130 30 -120 60" stroke="#228B22" stroke-width="8" fill="none"/>
        
        <!-- Right Leaves -->
        <path d="M0 0 Q50 -30 80 -10 Q100 10 90 40" stroke="#228B22" stroke-width="8" fill="none"/>
        <path d="M0 0 Q60 -20 90 0 Q120 20 110 50" stroke="#228B22" stroke-width="8" fill="none"/>
        <path d="M0 0 Q70 -10 100 10 Q130 30 120 60" stroke="#228B22" stroke-width="8" fill="none"/>
        
        <!-- Center Leaves -->
        <path d="M0 0 Q0 -40 -20 -60 Q-40 -80 -30 -100" stroke="#228B22" stroke-width="8" fill="none"/>
        <path d="M0 0 Q0 -40 20 -60 Q40 -80 30 -100" stroke="#228B22" stroke-width="8" fill="none"/>
